name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: "PHP ${{ matrix.php }} (ext-gmp: ${{ matrix.gmp }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        gmp: ['with', 'without']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }} (ext-gmp ${{ matrix.gmp }})
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.gmp == 'with' && 'gmp, mbstring' || ':gmp, mbstring' }}
          coverage: ${{ matrix.gmp == 'with' && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Verify ext-gmp state matches the matrix lane
        run: |
          php -r 'exit(extension_loaded("gmp") ? 0 : 1);' && echo "gmp: loaded" || echo "gmp: not loaded"
          if [ "${{ matrix.gmp }}" = "with" ]; then php -r 'exit(extension_loaded("gmp") ? 0 : 1);'; else php -r 'exit(extension_loaded("gmp") ? 1 : 0);'; fi

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run polyfill + unit suite
        if: matrix.gmp == 'without'
        run: vendor/bin/phpunit --testsuite unit,polyfill

      - name: Run differential + unit suite (with coverage)
        if: matrix.gmp == 'with'
        run: vendor/bin/phpunit --testsuite unit,differential --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.gmp == 'with' && matrix.php == '8.3'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  prefer-lowest:
    name: "Dependencies: --prefer-lowest (PHP 8.1)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.1 with ext-gmp
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: gmp, mbstring
          tools: composer:v2

      - name: Install lowest dependency versions
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-lowest --prefer-stable

      - name: Run test suites
        run: vendor/bin/phpunit --testsuite unit,differential

  phpstan:
    name: PHPStan (max level)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gmp, mbstring
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --error-format=github

  code-style:
    name: Code style (php-cs-fixer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.dist.php

  composer-validate:
    name: composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

  composer-audit:
    name: composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Audit dependencies
        run: composer audit
